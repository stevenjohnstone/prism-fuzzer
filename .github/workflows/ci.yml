name: CI Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static Analysis, Schemas & Require Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install RuboCop
        run: gem install --no-document rubocop

      - name: Run repository linters, coding standards, topology & require checks
        run: ruby bin/lint.rb --require-shellcheck --require-rubocop

      - name: Run host-native Minitest suite and runner smoke check
        run: |
          ruby test/run.rb --list
          ruby test/run.rb test/sankey_test.rb -v
