AllCops:
  TargetRubyVersion: 3.3
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "tmp/**/*"
    - "build/**/*"
    - "reports/**/*"
    - "patches/**/*"

Layout/EndOfLine:
  Enabled: true
  EnforcedStyle: lf

Layout/IndentationWidth:
  Enabled: true
  Width: 2

Layout/TrailingEmptyLines:
  Enabled: true
  EnforcedStyle: final_newline

Layout/TrailingWhitespace:
  Enabled: true

Lint/DuplicateMethods:
  Enabled: true

Lint/RescueException:
  Enabled: true

Lint/ShadowingOuterLocalVariable:
  Enabled: true

Lint/SuppressedException:
  Enabled: true
  AllowComments: true

Lint/UselessAssignment:
  Enabled: true

Security/Eval:
  Enabled: true

Security/MarshalLoad:
  Enabled: true

Security/Open:
  Enabled: true

Security/YAMLLoad:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
  Include:
    - "bin/**/*.rb"
    - "lib/**/*.rb"
    - "harnesses/**/*.rb"
    - "report/**/*.rb"
    - "runtime/**/*.rb"
    - "triage/**/*.rb"

Style/GlobalVars:
  Enabled: true

Style/RescueModifier:
  Enabled: true

Style/RescueStandardError:
  Enabled: true
  EnforcedStyle: explicit

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/TopLevelMethodDefinition:
  Enabled: true
  Exclude:
    - "campaigns/**/*"
    - "examples/**/*"
    - "test/**/*"

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false
